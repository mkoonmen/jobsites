<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Job Sites Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Job sites map for the field. Full-screen map with live GPS, a pull-up sheet, and the same colors as the Field Hub:
   orange = new build, blue = addition/renovation, green = visited, dark ring = builder named.
   Pella showrooms are big gold squares; home is a dark house badge. */
:root{--paper:#f4f6f5;--card:#fff;--ink:#15222a;--ink2:#52626b;--ink3:#83939b;--line:#e2e7e9;--hover:#eef2f3;--bay:#1d5c78;--grass:#5f8227;--flare:#e0441a;
  --head:"Bricolage Grotesque",system-ui,sans-serif;--body:"Instrument Sans",system-ui,-apple-system,sans-serif;--shadow:0 1px 2px rgba(21,34,42,.06),0 8px 28px rgba(21,34,42,.14)}
@media (prefers-color-scheme:dark){:root{--paper:#0d1418;--card:#141d22;--ink:#e8eef0;--ink2:#a0b0b8;--ink3:#71838c;--line:#243238;--hover:#1a252b;--bay:#6db1d0;--grass:#9cc25a}}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{font:16px/1.45 var(--body);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
#map{position:fixed;inset:0;background:#aad3df}
.top{position:fixed;z-index:1000;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;display:flex;justify-content:center;pointer-events:none}
.seg{pointer-events:auto;display:flex;gap:3px;padding:3px;border-radius:14px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);max-width:520px;width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:7px 6px;font-weight:600;font-size:.82rem;color:var(--ink2);white-space:nowrap;display:grid;line-height:1.15}
.seg button small{font-weight:500;font-size:.68rem;color:var(--ink3)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fab{position:fixed;z-index:1000;right:12px;width:46px;height:46px;border-radius:15px;border:0;background:var(--card);color:var(--bay);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:22px;height:22px}
#locbtn{bottom:calc(var(--peek) + 14px)}
#locbtn.on{background:var(--bay);color:#fff}
/* sheet */
:root{--peek:150px}
.sheet{position:fixed;z-index:1100;left:0;right:0;bottom:0;height:calc(100% - env(safe-area-inset-top,0px) - 64px);background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(21,34,42,.2);display:flex;flex-direction:column;transform:translateY(calc(100% - var(--peek)));transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.drag{transition:none}
.handle{flex:none;padding:10px 0 8px;touch-action:none;cursor:grab}
.handle::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.body{flex:1;overflow:auto;overscroll-behavior:contain;padding:0 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.sheet{top:0;right:auto;width:400px;height:auto;border-radius:0;transform:none!important}.handle{display:none}.body{padding-top:20px}#map{left:400px}.top{left:410px;justify-content:flex-start}#locbtn{bottom:24px}}
h2{font:700 1.35rem/1.15 var(--head);letter-spacing:-.01em;margin:2px 0 6px}
h3{font:700 1.5rem/1.08 var(--head);letter-spacing:-.015em;margin:4px 0 6px}
p{margin:0 0 6px;color:var(--ink2);font-size:.92rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 10px;font-size:.84rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 15px;border-radius:13px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:.93rem}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--bay);border-color:var(--bay);color:#fff}
.btn.go{background:var(--grass);border-color:var(--grass);color:#fff}
.btn.quiet{background:var(--hover);border-color:transparent}
textarea{width:100%;min-height:80px;margin-top:12px;border-radius:13px;border:1px solid var(--line);background:var(--paper);padding:11px}
.towns{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:8px}
.towns details{border-top:1px solid var(--line)}.towns details:first-child{border-top:0}
.towns summary{display:flex;align-items:center;gap:10px;padding:13px 15px;cursor:pointer;list-style:none;font-weight:650}
.towns summary::-webkit-details-marker{display:none}
.towns summary .n{margin-left:auto;font-size:.82rem;color:var(--ink3);font-weight:500}
.towns summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);transition:transform .2s;flex:none}
.towns details[open] summary::after{transform:rotate(-135deg)}
.trow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:10px}
.trow:hover{background:var(--hover)}
.trow b{display:block;font-weight:600;font-size:.92rem}.trow small{display:block;color:var(--ink2);font-size:.8rem}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;margin-top:4px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.dot.newb{background:#d9480f}.dot.reno{background:#1d5c78}.dot.done{background:#5f8227}.dot.nb{box-shadow:0 0 0 2px #15222a}
.dot.sq{border-radius:3px;background:#c99a2e;width:13px;height:13px}.dot.home{border-radius:4px;background:#15222a}
.pin{display:grid;place-items:center;border-radius:50%;color:#fff;font:700 11px/1 var(--body);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.newb{background:#d9480f}.pin.reno{background:#1d5c78}.pin.done{background:#5f8227}.pin.nb{border:3px solid #15222a}
.pin.me{background:#2f7cf6;border:3px solid #fff;box-shadow:0 0 0 8px rgba(47,124,246,.22),0 1px 4px rgba(0,0,0,.4)}
.badge{display:flex;align-items:center;gap:5px;white-space:nowrap;padding:5px 9px 5px 6px;border-radius:10px;font:800 12px/1 var(--body);box-shadow:0 2px 8px rgba(0,0,0,.35);border:2px solid #fff}
.badge svg{width:16px;height:16px}
.badge.show{background:#c99a2e;color:#231a00}
.badge.home{background:#15222a;color:#fff}
.tlabel{font:700 11px/18px var(--body);text-align:center;text-transform:uppercase;letter-spacing:.06em;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap;pointer-events:none}
.toast{position:fixed;z-index:2000;left:50%;bottom:calc(var(--peek) + 16px);transform:translate(-50%,10px);opacity:0;transition:.2s;background:var(--ink);color:var(--paper);border-radius:13px;padding:10px 16px;font-size:.9rem;pointer-events:none;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.leaflet-container{font:inherit}
.leaflet-bar a{width:40px!important;height:40px!important;line-height:40px!important;font-size:20px!important}
@media (max-width:899px){.leaflet-control-zoom{display:none}}
.muted{color:var(--ink3);font-size:.82rem}
</style>
</head>

const HOME=ls.get('jm-home',null);

/* map */
const map=L.map('map',{zoomControl:false,preferCanvas:false}).setView(HOME||[40.85,-72.9],HOME?12:9);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const TCOL=['#1d5c78','#7a4fb0','#b9800f','#2f7d5b','#c2410c','#4a5a8a','#8a5a2b','#0f766e'];
const flip=g=>g.type==='Polygon'?[g.coordinates.map(r=>r.map(([x,y])=>[y,x]))]:g.coordinates.map(p=>p.map(r=>r.map(([x,y])=>[y,x])));
BOUNDS.filter(b=>b.kind==='town').forEach((b,i)=>{const col=TCOL[i%TCOL.length];const pl=L.polygon(flip(b.geo),{color:col,weight:1.6,opacity:.75,dashArray:'5 4',fillColor:col,fillOpacity:.05,interactive:false}).addTo(map);
  L.marker(pl.getBounds().getCenter(),{icon:L.divIcon({className:'',html:`<div class="tlabel" style="color:${col}">${esc(b.name)}</div>`,iconSize:[130,18],iconAnchor:[65,9]}),interactive:false,zIndexOffset:-1000}).addTo(map);});
BOUNDS.filter(b=>b.kind==='county').forEach(b=>L.polygon(flip(b.geo),{color:'#15222a',weight:3,opacity:.65,fill:false,interactive:false}).addTo(map));

const pin=(cls,html,w)=>L.divIcon({className:'',html:`<div class="pin ${cls}" style="width:${w}px;height:${w}px">${html}</div>`,iconSize:[w,w],iconAnchor:[w/2,w/2]});
const badge=(cls,ic,txt)=>L.divIcon({className:'',html:`<div class="badge ${cls}">${ic}${esc(txt)}</div>`,iconSize:null,iconAnchor:[14,14]});
let F=ls.get('jm-filter','all'), LAYER=null;
function shown(){return SITES.filter(s=>{const v=isV(s);return F==='all'||(F==='todo'?!v:F==='done'?v:F==='named'?s.builder:s.nb)})}
function draw(){
  if(LAYER) LAYER.remove(); LAYER=L.layerGroup().addTo(map);
  shown().forEach(s=>{const v=isV(s),n=!!s.builder;const cls=v?'done':(s.nb?'newb':'reno')+(n?' nb':'');
    L.marker([s.lat,s.lon],{icon:pin(cls,v?'✓':'',v||n?20:16),zIndexOffset:v?800:s.nb?500:0}).on('click',()=>card(s)).addTo(LAYER)});
  PLACES.forEach(p=>L.marker([p.lat,p.lon],{icon:badge('show',I.store,'Pella'),zIndexOffset:5000}).on('click',()=>placeCard(p)).addTo(LAYER));
  if(HOME) L.marker(HOME,{icon:badge('home',I.home,'Home'),zIndexOffset:5000}).on('click',()=>placeCard({kind:'home',name:'Home',addr:'Home',lat:HOME[0],lon:HOME[1]})).addTo(LAYER);
  filters();
}
function filters(){const v=SITES.filter(isV).length;
  $('filters').innerHTML=[['all','All',SITES.length],['todo','To visit',SITES.length-v],['done','Visited',v],['named','Builder named',SITES.filter(s=>s.builder).length],['new','New builds',SITES.filter(s=>s.nb).length]].map(([k,t,n])=>`<button data-f="${k}" aria-pressed="${F===k}">${t}<small>${n}</small></button>`).join('')}
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;F=b.dataset.f;ls.set('jm-filter',F);draw();summary()});

/* navigation links: Waze by default */
let NAV=ls.get('jm-nav','waze');
function navUrl(lat,lon,q,approx){const e=encodeURIComponent(q);
  if(NAV==='apple')return `https://maps.apple.com/?daddr=${approx?e:lat+','+lon}&dirflg=d`;
  if(NAV==='google')return `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${approx?e:lat+','+lon}`;
  return approx?`https://waze.com/ul?q=${e}&navigate=yes`:`https://waze.com/ul?ll=${lat},${lon}&navigate=yes`}
const navPick=()=>`<p class="muted" style="margin-top:12px">Navigate opens in ${[['waze','Waze'],['apple','Apple Maps'],['google','Google']].map(([k,t])=>`<button class="btn quiet" style="min-height:30px;padding:0 10px;font-size:.8rem;${NAV===k?'background:var(--ink);color:var(--card)':''}" data-nav="${k}">${t}</button>`).join(' ')}</p>`;

/* sheet content */
let CUR=null;
function card(s){CUR=s;const k=key(s.addr),v=VIS[k];
  $('body').innerHTML=`<p>${esc(s.town)}${s.date?', dated '+esc(md(s.date)):''}</p><h3>${esc(short(s.addr))}</h3>
  <p>${esc([s.builder?'Builder: '+s.builder:'No builder named on record',s.type||(s.nb?'New build':'')].filter(Boolean).join('. '))}</p>
  ${s.owner?`<p>On record: ${esc(s.owner)}</p>`:''}${s.approx?'<p class="muted">Pin is approximate; the record gives only the street.</p>':''}
  <div class="btns"><a class="btn primary" href="${navUrl(s.lat,s.lon,s.navq||s.addr,s.approx)}" target="_blank" rel="noopener">${I.nav}Navigate</a>
  <button class="btn ${v?'go':''}" data-toggle>${v?I.check+'Visited':'Mark visited'}</button><button class="btn quiet" data-back>All sites</button></div>
  <textarea id="note" placeholder="Notes: GC on site, windows going in, who you talked to">${esc(v?.note||'')}</textarea>${navPick()}`;
  open('half')}
function placeCard(p){CUR=null;
  $('body').innerHTML=`<p>${p.kind==='show'?'Pella showroom':'Home'}</p><h3>${esc(p.name)}</h3>${p.kind==='show'?`<p>${esc(p.addr)}</p>`:''}
  <div class="btns"><a class="btn primary" href="${navUrl(p.lat,p.lon,p.addr,false)}" target="_blank" rel="noopener">${I.nav}Navigate</a><button class="btn quiet" data-back>All sites</button></div>${navPick()}`;
  open('half')}
function summary(){CUR=null;const sh=shown();const towns={};sh.forEach(s=>(towns[s.town]=towns[s.town]||[]).push(s));
  const list=Object.entries(towns).sort((a,b)=>b[1].length-a[1].length);
  $('body').innerHTML=`<h2>${sh.length} job sites</h2>
  <div class="legend"><span><i class="dot newb"></i>New build</span><span><i class="dot reno"></i>Addition or renovation</span><span><i class="dot done"></i>Visited</span><span><i class="dot reno nb"></i>Builder named</span><span><i class="dot sq"></i>Pella showroom</span>${HOME?'<span><i class="dot home"></i>Home</span>':''}</div>
  <p>Tap a pin for directions, to mark it visited, or to jot notes. Visits and notes stay on this phone.</p>
  <div class="towns">${list.map(([t,a])=>`<details><summary>${esc(t||'Other')}<span class="n">${a.length}${a.some(isV)?' · '+a.filter(isV).length+' visited':''}</span></summary>${a.sort((x,y)=>(y.nb-x.nb)||x.addr.localeCompare(y.addr)).map(s=>`<button class="trow" data-addr="${esc(s.addr)}"><i class="dot ${isV(s)?'done':s.nb?'newb':'reno'}"></i><span><b>${esc(short(s.addr))}</b><small>${esc([s.builder,s.type,md(s.date)].filter(Boolean).join(' · '))}</small></span></button>`).join('')}</details>`).join('')}</div>`}
$('body').addEventListener('click',e=>{
  if(e.target.closest('[data-back]')){summary();open('peek');return}
  const t=e.target.closest('[data-addr]');if(t){const s=SITES.find(x=>x.addr===t.dataset.addr);if(s){map.setView([s.lat,s.lon],Math.max(map.getZoom(),15));card(s)}return}
  const n=e.target.closest('[data-nav]');if(n){NAV=n.dataset.nav;ls.set('jm-nav',NAV);CUR?card(CUR):summary();toast('Navigate now opens '+n.textContent);return}
  if(e.target.closest('[data-toggle]')&&CUR){const k=key(CUR.addr);if(VIS[k]){delete VIS[k];toast('Marked not visited')}else{VIS[k]={d:TODAY,note:$('note').value};toast('Marked visited')}ls.set('jm-visits',VIS);draw();card(CUR)}
});
$('body').addEventListener('focusout',e=>{if(e.target.id==='note'&&CUR){const k=key(CUR.addr);const t=e.target.value.trim();if(!t&&!VIS[k])return;VIS[k]=VIS[k]||{d:TODAY};VIS[k].note=t;ls.set('jm-visits',VIS);draw();toast('Saved')}});

/* bottom sheet */
const sheet=$('sheet');let st='peek',y0=null,start=0,t0=0,moved=false;
const desk=()=>matchMedia('(min-width:900px)').matches,H=()=>sheet.getBoundingClientRect().height;
const off={peek:()=>H()-150,half:()=>H()*.45,full:()=>0};
function open(s){st=s;sheet.style.transform=desk()?'':`translateY(${off[s]()}px)`}
const hd=$('handle');
hd.addEventListener('pointerdown',e=>{if(desk())return;y0=e.clientY;t0=performance.now();start=new DOMMatrix(getComputedStyle(sheet).transform).m42;moved=false;sheet.classList.add('drag');hd.setPointerCapture(e.pointerId)});
hd.addEventListener('pointermove',e=>{if(y0==null)return;const dy=e.clientY-y0;if(Math.abs(dy)>3)moved=true;sheet.style.transform=`translateY(${Math.max(0,Math.min(H()-80,start+dy))}px)`});
const end=e=>{if(y0==null)return;sheet.classList.remove('drag');const dy=e.clientY-y0,v=dy/Math.max(1,performance.now()-t0);y0=null;const o=['full','half','peek'];
  if(!moved)return open(st==='peek'?'half':st==='half'?'full':'peek');if(Math.abs(v)>.45){const i=o.indexOf(st);return open(o[Math.max(0,Math.min(2,i+(v>0?1:-1)))])}
  const pos=start+dy;let b='peek',bd=1e9;for(const s of o){const d=Math.abs(off[s]()-pos);if(d<bd){bd=d;b=s}}open(b)};
hd.addEventListener('pointerup',end);hd.addEventListener('pointercancel',end);addEventListener('resize',()=>open(st));

/* live location */
let ME=null,meMarker=null,follow=true,firstFix=true;
function onPos(p){ME=[p.coords.latitude,p.coords.longitude];
  if(!meMarker)meMarker=L.marker(ME,{icon:pin('me','',20),zIndexOffset:9000,interactive:false}).addTo(map);else meMarker.setLatLng(ME);
  if(firstFix){firstFix=false;map.setView(ME,13)}else if(follow)map.panTo(ME,{animate:true});$('locbtn').classList.toggle('on',follow)}
function onErr(e){$('locbtn').classList.remove('on');if(e.code===1)toast('Location is off. Settings > Privacy > Location Services > Safari Websites > While Using.');}
if(navigator.geolocation)navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:5000,timeout:30000});
map.on('dragstart',()=>{follow=false;$('locbtn').classList.remove('on')});
$('locbtn').addEventListener('click',()=>{follow=true;if(ME){map.setView(ME,Math.max(map.getZoom(),14));$('locbtn').classList.add('on')}else{toast('Finding you…');navigator.geolocation&&navigator.geolocation.getCurrentPosition(onPos,onErr,{enableHighAccuracy:true,timeout:15000})}});

draw();summary();open('peek');
</script>
</body>
</html>
